name: Deploy to Zerops

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: "Deploy backend"
        type: boolean
        default: true
      website:
        description: "Deploy website"
        type: boolean
        default: true
      dashboard:
        description: "Deploy dashboard"
        type: boolean
        default: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:quality
        env:
          API_URL: http://localhost:3000/api/v1
          PUBLIC_API_URL: /api/v1

  test:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @lmaa/shared
      - run: npm test -w @lmaa/backend

  deploy-backend:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: api.lmaa.space
          output: apps/backend/public/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - uses: zeropsio/actions@v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_BACKEND_SERVICE_ID }}

  deploy-website:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: lmaa.space
          output: apps/frontend/public/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - uses: zeropsio/actions@v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_WEBSITE_SERVICE_ID }}

  deploy-dashboard:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: dashboard.lmaa.space
          output: apps/dashboard/public/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - uses: zeropsio/actions@v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_DASHBOARD_SERVICE_ID }}

  smoke-prod:
    needs: [deploy-backend, deploy-website, deploy-dashboard]
    if: |
      always() &&
      needs.deploy-backend.result != 'failure' &&
      needs.deploy-website.result != 'failure' &&
      needs.deploy-dashboard.result != 'failure' &&
      (needs.deploy-backend.result == 'success' ||
       needs.deploy-website.result == 'success' ||
       needs.deploy-dashboard.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test production routes
        run: bash scripts/smoke-prod.sh
        env:
          WEB_BASE_URL: https://lmaa.space

name: Deploy to Zerops

on:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run ci:quality
        env:
          API_URL: http://localhost:3000/api/v1
          PUBLIC_API_URL: /api/v1

  test:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w @lmaa/shared
      - run: npm test -w @lmaa/backend

  detect-changes:
    needs: [quality-gate, test]
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      website: ${{ steps.filter.outputs.website }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'zerops.yml'
            website:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'zerops.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'zerops.yml'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: zeropsio/actions@v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_BACKEND_SERVICE_ID }}

  deploy-website:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: zeropsio/actions@v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_WEBSITE_SERVICE_ID }}

  deploy-dashboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: zeropsio/actions@v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_DASHBOARD_SERVICE_ID }}

  smoke-prod:
    needs: [quality-gate, detect-changes, deploy-backend, deploy-website, deploy-dashboard]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.website == 'true') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-website.result == 'success' || needs.deploy-website.result == 'skipped') &&
      (needs.deploy-dashboard.result == 'success' || needs.deploy-dashboard.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test production routes
        run: bash scripts/smoke-prod.sh
        env:
          WEB_BASE_URL: https://lmaa.space

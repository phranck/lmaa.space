name: Deploy to Zerops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: "Deploy backend"
        type: boolean
        default: true
      website:
        description: "Deploy website"
        type: boolean
        default: true
      dashboard:
        description: "Deploy dashboard"
        type: boolean
        default: true

# A pull request only needs the run for its newest commit, so an older one is
# cancelled. A run on main deploys, and cancelling that half way would leave a
# service mid-rollout, so a later run waits for the current one to finish. Two
# overlapping deployments also make the earlier run's smoke test hit a host the
# later run is still replacing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types, build, artefact checks and the suites, in one job. They used to
  # be two, which meant a second runner, a second install of the dependencies,
  # and the suites waiting for a gate they take nothing from. The install is the
  # expensive part at around half a minute, whilst the suites themselves run in
  # under twenty seconds.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:quality
        env:
          API_URL: http://localhost:3000/api/v1
          PUBLIC_API_URL: /api/v1
      # Four workspaces carry a suite: backend, shared, dashboard and frontend.
      # `ci:quality` has already built @lmaa/shared, which they import.
      - run: npm test --workspaces --if-present

  # Which services a change can actually reach. The workspace graph decides it:
  # backend depends on contracts and shared, website and dashboard additionally
  # on ui. Anything shared by all three, and anything not attributable to a
  # single service, deploys everything, because a service left on a stale build
  # costs more than a redundant deployment.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      website: ${{ steps.filter.outputs.website }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.nvmrc'
              - 'zerops.yml'
              - '.github/workflows/deploy.yml'
              - 'scripts/**'
              - 'packages/shared/**'
              - 'packages/contracts/**'
            backend:
              - *shared
              - 'apps/backend/**'
            website:
              - *shared
              - 'packages/ui/**'
              - 'apps/frontend/**'
            dashboard:
              - *shared
              - 'packages/ui/**'
              - 'apps/dashboard/**'

  deploy-backend:
    needs: [quality-gate, changes]
    if: >-
      always() && needs.quality-gate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.backend))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: api.lmaa.space
          output: apps/backend/public/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - uses: zeropsio/actions@79c2d03f7c82ac58d011be746da3332f2f93c680 # v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_BACKEND_SERVICE_ID }}

  deploy-website:
    needs: [quality-gate, changes]
    if: >-
      always() && needs.quality-gate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.website == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.website))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: lmaa.space
          output: apps/frontend/public/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - uses: zeropsio/actions@79c2d03f7c82ac58d011be746da3332f2f93c680 # v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_WEBSITE_SERVICE_ID }}

  deploy-dashboard:
    needs: [quality-gate, changes]
    if: >-
      always() && needs.quality-gate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.dashboard == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.dashboard))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add security.txt
        uses: phranck/security-txt-action@v1
        with:
          host: dashboard.lmaa.space
          output: apps/dashboard/public/.well-known
          signing-key: ${{ secrets.SECURITY_TXT_SIGNING_KEY }}
          signing-passphrase: ${{ secrets.SECURITY_TXT_SIGNING_PASSPHRASE }}
      - uses: zeropsio/actions@79c2d03f7c82ac58d011be746da3332f2f93c680 # v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_DASHBOARD_SERVICE_ID }}

  smoke-prod:
    needs: [deploy-backend, deploy-website, deploy-dashboard]
    if: |
      always() &&
      needs.deploy-backend.result != 'failure' &&
      needs.deploy-website.result != 'failure' &&
      needs.deploy-dashboard.result != 'failure' &&
      (needs.deploy-backend.result == 'success' ||
       needs.deploy-website.result == 'success' ||
       needs.deploy-dashboard.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test production routes
        run: bash scripts/smoke-prod.sh
        env:
          WEB_BASE_URL: https://lmaa.space

name: Shopcheck CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/shopcheck/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'apps/shopcheck/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck -w @lmaa/shopcheck
      - run: npm test -w @lmaa/shopcheck

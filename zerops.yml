# lmaa.space — Zerops deployment configuration (2026-03-16)
zerops:
  # BACKEND SERVICE (Hono + Node.js) — lmaa.space
  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        # `npm ci` reinstalls 1360 packages on every build. Measured on one
        # deployment: 4m19s of 11m33s, whilst the build itself took 1m02s. The
        # `.npm` cache spares the download and not the unpacking, so the
        # installed tree is cached too and the install is skipped whilst the
        # lockfile is unchanged.
        #
        # The hash is what makes that safe. Any change to package-lock.json
        # falls through to a full install, and so does a missing or incomplete
        # cache, which leaves the worst case exactly as slow as today.
        - |
          LOCK_HASH="$(sha256sum package-lock.json | cut -d' ' -f1)"
          if [ -d node_modules ] && [ "$(cat .npm-lock-hash 2>/dev/null)" = "$LOCK_HASH" ]; then
            echo "dependencies unchanged, skipping npm ci"
          else
            npm ci --cache .npm
            printf '%s' "$LOCK_HASH" > .npm-lock-hash
          fi
        - npm run build -w @lmaa/shared
        - npm run build -w @lmaa/backend
        - npm run docs:build -w @lmaa/backend
      deployFiles:
        - apps/backend/dist
        - apps/backend/docs-dist
        - apps/backend/drizzle
        - apps/backend/public
        # The automated review sends these rules to the provider on every run
        # and refuses to run without them, so they ship with the backend.
        - .claude/skills/lmaa-shop-check/SKILL.md
        - apps/frontend/src/assets/fonts
        - node_modules/sharp
        - node_modules/@img
        # sharp's own runtime dependencies. They used to arrive by accident,
        # because sharp was being inlined into the backend bundle; now that it is
        # correctly external, it resolves these itself at runtime.
        - node_modules/detect-libc
        - node_modules/semver
      cache:
        - .npm
        - .npm-lock-hash
        - node_modules
        - apps/backend/node_modules
        - apps/dashboard/node_modules
        - apps/frontend/node_modules
        - packages/shared/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        HOST: 0.0.0.0
        # No PORT here. Zerops holds that key itself and rejects the whole file
        # when it is set, so the port lives under `ports` above and the service
        # falls back to the same number on its own. See the default in
        # apps/backend/src/config/env.ts.
        NODE_ENV: production
        DATABASE_URL: ${postgres_connectionString}
        DATABASE_URL_MIGRATOR: ${postgres_connectionString}
        DB_MIGRATION_ROLE: "db"
        RUN_MIGRATIONS_ON_STARTUP: "true"
        # Secrets (set in Zerops dashboard):
        # IP_HASH_SALT (required in production, min. 16 characters)
        # SMTP2GO_API_KEY
        # EMAIL_FROM  (default: hallo@lmaa.space)
        # OWNER_EMAIL (recipient for report/submission notifications)
        # INTERNAL_API_TOKEN (min. 32 characters, same value on the website
        #   service). Lets the website's server-side rendering skip the public
        #   rate limits, which it needs because those requests reach the backend
        #   directly and therefore carry no client address. Optional: while it is
        #   unset nothing is exempt and every caller is limited as before.
        # ENABLE_BANKING_APPLICATION_ID and ENABLE_BANKING_PRIVATE_KEY. The two
        #   halves of one credential, through which the site reads its own bank
        #   account. Set both or neither: with only one the service refuses to
        #   start. With neither, the bank connection routes answer 503 and
        #   nothing else changes. The key is a PKCS#8 PEM, and the variable
        #   editor holds one line, so its line breaks are written out as \n and
        #   turned back by apps/backend/src/config/env.ts.
      initCommands:
        - node apps/backend/dist/db/doctor.js
        - node apps/backend/dist/db/migrate.js
      start: node apps/backend/dist/index.js

  # WEBSITE SERVICE (Astro SSR → Node.js)
  - setup: website
    build:
      base: nodejs@22
      envVariables:
        API_URL: http://backend:3000/api/v1
        PUBLIC_API_URL: /api/v1
      buildCommands:
        - npm ci --cache .npm
        - npm run build -w @lmaa/shared
        - npm run build -w @lmaa/frontend
        # The tree the build needs is not the tree the site runs on. This one
        # holds only what the website itself needs to run, so the artefact stops
        # carrying every workspace's development packages and the backend's and
        # the dashboard's dependencies with them. Measured locally: 1102 MB
        # against 486 MB.
        #
        # An earlier attempt at this left the service dead on startup, because
        # the reduced install did not contain astro. That cannot happen from
        # here: `astro` and `@astrojs/node` are runtime dependencies of
        # apps/frontend rather than development ones, and every bare import in
        # the built server entry resolves in this tree.
        #
        # No install script runs. `vite` and `tsx` are runtime dependencies of
        # @astrojs/react, so they come along, and esbuild's script checks the
        # binary it finds against the version it expects. The two installs place
        # esbuild differently, so it finds the other one and stops the build.
        # The site executes none of these, and sharp brings its platform files
        # as packages rather than through a script.
        - npm ci --omit=dev --workspace @lmaa/frontend --include-workspace-root --ignore-scripts --cache .npm
      deployFiles:
        - apps/frontend/dist
        - node_modules
        # npm keeps astro and its dependencies in the workspace's own directory
        # rather than hoisting them, and the built server entry resolves
        # `es-module-lexer` from there at runtime.
        - apps/frontend/node_modules
        - package.json
      # Only the download cache here. The second install below replaces both
      # the root and the workspace trees with production-only ones, and a later
      # build restoring those would find no development packages and fail. What it
      # would take instead is worked out in issue #317.
      cache: .npm
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        HOST: 0.0.0.0
        # No PORT here either, for the reason given on the backend service. The
        # built server falls back to the same number, set in
        # apps/frontend/astro.config.mjs.
        NODE_ENV: production
        API_URL: http://backend:3000/api/v1
        # Secrets (set in Zerops dashboard):
        # INTERNAL_API_TOKEN (must match the backend service exactly). Sent as
        #   X-Internal-Token on server-side data fetches and on nothing else.
      start: node apps/frontend/dist/server/entry.mjs

  # DASHBOARD SERVICE (React + Vite → Static)
  - setup: dashboard
    build:
      base: nodejs@22
      buildCommands:
        # `npm ci` reinstalls 1360 packages on every build. Measured on one
        # deployment: 4m19s of 11m33s, whilst the build itself took 1m02s. The
        # `.npm` cache spares the download and not the unpacking, so the
        # installed tree is cached too and the install is skipped whilst the
        # lockfile is unchanged.
        #
        # The hash is what makes that safe. Any change to package-lock.json
        # falls through to a full install, and so does a missing or incomplete
        # cache, which leaves the worst case exactly as slow as today.
        - |
          LOCK_HASH="$(sha256sum package-lock.json | cut -d' ' -f1)"
          if [ -d node_modules ] && [ "$(cat .npm-lock-hash 2>/dev/null)" = "$LOCK_HASH" ]; then
            echo "dependencies unchanged, skipping npm ci"
          else
            npm ci --cache .npm
            printf '%s' "$LOCK_HASH" > .npm-lock-hash
          fi
        - npm run build -w @lmaa/shared
        - npm run build -w @lmaa/dashboard
      deployFiles:
        - apps/dashboard/dist
        - apps/dashboard/nginx.tmpl
      cache:
        - .npm
        - .npm-lock-hash
        - node_modules
        - apps/backend/node_modules
        - apps/dashboard/node_modules
        - apps/frontend/node_modules
        - packages/shared/node_modules
    run:
      base: nginx@1.22
      ports:
        - port: 80
          httpSupport: true
      documentRoot: apps/dashboard/dist
      siteConfigPath: apps/dashboard/nginx.tmpl

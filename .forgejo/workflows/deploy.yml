name: Deploy to Zerops

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: "Deploy backend"
        type: boolean
        default: true
      website:
        description: "Deploy website"
        type: boolean
        default: true
      dashboard:
        description: "Deploy dashboard"
        type: boolean
        default: true

jobs:
  test:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w @lmaa/shared
      - run: npm test -w @lmaa/backend

  deploy-backend:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.backend)
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install zcli
        run: curl -L https://zerops.io/zcli/install.sh | sh
      - name: Deploy backend
        run: zcli login "$ZEROPS_TOKEN" && zcli push --project-id "$ZEROPS_PROJECTID" --service-id "$ZEROPS_SERVICE_ID"
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_PROJECTID: ${{ secrets.ZEROPS_PROJECTID }}
          ZEROPS_SERVICE_ID: ${{ secrets.ZEROPS_BACKEND_SERVICE_ID }}

  deploy-website:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.website)
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install zcli
        run: curl -L https://zerops.io/zcli/install.sh | sh
      - name: Deploy website
        run: zcli login "$ZEROPS_TOKEN" && zcli push --project-id "$ZEROPS_PROJECTID" --service-id "$ZEROPS_SERVICE_ID"
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_PROJECTID: ${{ secrets.ZEROPS_PROJECTID }}
          ZEROPS_SERVICE_ID: ${{ secrets.ZEROPS_WEBSITE_SERVICE_ID }}

  deploy-dashboard:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dashboard)
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install zcli
        run: curl -L https://zerops.io/zcli/install.sh | sh
      - name: Deploy dashboard
        run: zcli login "$ZEROPS_TOKEN" && zcli push --project-id "$ZEROPS_PROJECTID" --service-id "$ZEROPS_SERVICE_ID"
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_PROJECTID: ${{ secrets.ZEROPS_PROJECTID }}
          ZEROPS_SERVICE_ID: ${{ secrets.ZEROPS_DASHBOARD_SERVICE_ID }}

  smoke-prod:
    needs: [deploy-backend, deploy-website, deploy-dashboard]
    if: |
      always() &&
      needs.deploy-backend.result != 'failure' &&
      needs.deploy-website.result != 'failure' &&
      needs.deploy-dashboard.result != 'failure' &&
      (needs.deploy-backend.result == 'success' ||
       needs.deploy-website.result == 'success' ||
       needs.deploy-dashboard.result == 'success')
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Smoke test production routes
        run: bash scripts/smoke-prod.sh
        env:
          WEB_BASE_URL: https://lmaa.space
